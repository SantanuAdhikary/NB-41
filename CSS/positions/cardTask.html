<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card task</title>

    <style>
         *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
         }

         .outer{
            height: 100vh;
            background-color: purple;
            display: flex;
            justify-content: center;
            align-items: center;
         }

         .profileCard{
            height: 380px;
            width: 420px;
            background-color: white;
            position: relative;
            border-radius: 20px;
            box-shadow: 6px 10px 8px rgba(0,0,0,0.5);
         }

         .circle1{
            height: 140px;
            width: 140px;
            background-color: red;
            border: 3px solid black;
            border-radius: 50%;
            position: absolute;
            left:50%;
            top:-70px;
            transform: translateX(-50%);
         }
         .circle2{
            height: 140px;
            width: 140px;
            background-color: blue;
            border: 3px solid black;
            border-radius: 50%;
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
           
         }
         .circle3{
            height: 140px;
            width: 140px;
            background-color: yellow;
            border: 3px solid black;
            border-radius: 50%;
            position: absolute;
             right: -70px;
             top:50%;
             transform: translateY(-50%);
           
         }
         .circle4{
            height: 140px;
            width: 140px;
            background-color: green;
            border: 3px solid black;
            border-radius: 50%;
           position: absolute;
           top:50%;
           transform: translateY(-50%);
           left:-70px;
           
         }
         .circle5{
            height: 140px;
            width: 140px;
            background-color: pink;
            border: 3px solid black;
            border-radius: 50%;
           position: absolute;
           left: 50%;
           top:50%;
           transform: translate(-50%,-50%);
           
         }
    </style>
</head>
<body>
    
    <div class="outer">
         <div class="profileCard">

            <div class="circle1"></div>
            <div class="circle2"></div>
            <div class="circle3"></div>
            <div class="circle4"></div>
            <div class="circle5"></div>

         </div>
    </div>
</body>
</html>
