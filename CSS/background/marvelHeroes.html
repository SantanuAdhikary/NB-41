<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background task(marvel heroes)</title>
    <style>
         *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
         }

         section{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-size: cover;
            background-position: top;
            background-attachment: fixed;
         }

         section > h1{
            font-size: 70px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color:white;
            text-shadow: 3px 5px 5px red;
         }

         #s1{
            background-image: url("./ironman.jpg");
         }

         #s2{
            background-image: url("./captain.jpg");
         }
         #s3{
            background-image: url("./thor.jpg");
         }
         #s4{
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBR8TW_ol7jAMfOXE652gkSV09KwyPtOBfcJpuiOBgLott13uv40FubUk&s=10");
         }
         #s5{
            background-image: url("https://cdn.europosters.eu/image/1300/image/750/wall-murals/spiderman-marvel-i41725.jpg");
         }
    </style>
</head>
<body>
    <section id="s1">
              <h1>ironman</h1>
    </section>
    <section id="s2">
              <h1>captain america</h1>
    </section>
    <section id="s3">
              <h1>thor</h1>
    </section>
    <section id="s4">
              <h1>hulk</h1>
    </section>
    <section id="s5">
              <h1>spiderman</h1>
    </section>
</body>
</html>
