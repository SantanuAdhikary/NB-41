<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        .orange{
            height: 33vh;
            background-color: orange;
        }
        .green{
            height: 33vh;
            background-color: green;
        }
        .white{
            height: 33vh;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img{
           height: 90%;
           animation: spinning 3s linear infinite;
        }

        @keyframes spinning {
    
            from{
            transform: rotate(0deg);
            }
            to{
                transform: rotate(360deg);

            }
        }

    </style>
</head>
<body>
    <div class="orange"></div>
    <div class="white">
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/17/Ashoka_Chakra.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="">
    </div>
    <div class="green"></div>
</body>
</html>
