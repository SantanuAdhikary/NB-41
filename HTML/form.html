<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form in html</title>
</head>
<body>
    
    <h1>Student Form </h1>

    <form action="" method="">

        <fieldset>

            <legend>student form</legend>

            <label for="sname">Student Name</label>
            <input type="text" id="sname" placeholder="your name" name="stuname" value="" required>           <br>
    
            <label for="phno">phone number</label>
            <input type="tel" id="phno" placeholder="your number" name="stuph" maxlength="10">         <br>

            <label for="pass">Password</label>
            <input type="password" id="pass" placeholder="your password" name="stupass" minlength="5">           <br>

            <label for="age">age</label>
            <input type="number" name="sage" id="age" placeholder="your age">  <br>


            <label for="semail">email</label>
            <input type="email" name="semail" id="semail" placeholder="your email" value="student@gmail.com" readonly>  <br>


            <label for="">subjects</label> <br>

            <label for="sub1">HTML</label>
            <input type="checkbox" name="sub1" id="sub1" value="html">

            <label for="sub2">CSS</label>
            <input type="checkbox" name="sub2" id="sub2" value="css">

            <label for="sub3">JAVASCRIPT</label>
            <input type="checkbox" name="sub3" id="sub3" value="javascript"> <br>


            <label for="">Gender</label> <br>

            <label for="m">Male</label>
            <input type="radio" name="gender" id="m" value="male">

            <label for="f">Female</label>
            <input type="radio" name="gender" id="f" value="female">

            <label for="o">Others</label>
            <input type="radio" name="gender" id="o" value="others">      <br>



            <label for="adrs">Address</label> <br>
            <textarea name="address" id="adrs" placeholder="your address" rows="10" cols="40"></textarea>
            <br>

            <label for="">select course</label><br>

            <select name="course" id="">
                <option value=""></option>
                <option value="java">java</option>
                <option value="python">python</option>
                <option value="typescript">typescript</option>
            </select> <br>

            <label for="">enter your dob</label>
            <input type="date" name="dob" id="">  <br>


            <button type="submit">register</button>
            <button type="reset"> reset</button>
            <button disabled="disabled">click me</button>
        </fieldset>



    </form>
</body>
</html>
