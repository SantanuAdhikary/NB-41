<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>div tag</title>


    <style>
             #nav{
                background-color: lightblue;
                display: flex;
                justify-content: space-around;
                align-items: center;
                height: 80px;
             }

             *{
                padding: 0;
                margin: 0;
                box-sizing: border-box;
             }


             ul{
                display: flex;
                gap:20px;
                list-style: none;
             }

             li{
                font-size: 18px;
                font-weight: bold;
                text-transform: uppercase;
                cursor: pointer;
             }

             #main{
                height: 250px;
                background-color: lightseagreen;

                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap:15px;

             }

             #section{
                 height: calc(100vh - 350px);
                 background-color: lightpink;
                 display: flex;
                 justify-content: space-around;
                 align-items: center;
             }

             .card{
                height: 200px;
                width: 300px;
                padding: 15px;
                background-color: white;
                border-radius: 15px;
                box-shadow: 0px 4px 15px black;
                text-align: center;
             }

             span{
                color:orangered;
                font-style: italic;
             }
    </style>

</head>
<body>
    <div id="nav">
            <h1> <span>my</span>Logo</h1>

            <ul>
                <li>home</li>
                <li>about</li>
                <li>contact</li>
            </ul>
    </div>

    <div id="main">
        <h1>we are learing about div tag </h1>
        <p> div tag is used to group all types of element and it is block level element.</p>
        <button>get started</button>
    </div>

    <div id="section">

          <div class="card">
                 <h2>I am card1</h2>
          </div>

          <div class="card">
                 <h2>I am card2</h2>
          </div>

          <div class="card">
                 <h2>I am card3</h2>
          </div>
    </div>
</body>
</html>
